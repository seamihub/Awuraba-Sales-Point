function tickClock(){
  const now = new Date();
  const label = manualDate
    ? `Using manual date: ${new Date(manualDate+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}`

}
function renderDateOverrideRow(){
  const row = document.getElementById('dateOverrideRow');
  if(manualDate){
    row.innerHTML = `<a href="#" id="clearOverride" style="color:var(--gold)">Resume automatic date/time</a>`;
    document.getElementById('clearOverride').onclick = (e)=>{e.preventDefault(); manualDate=null; renderDateOverrideRow(); tickClock(); render();};

    row.innerHTML = `<a href="#" id="setOverride" style="color:var(--gold)">Set date manually (no internet?)</a>`;

      e.preventDefault();
      const v = await uiPrompt('Enter the correct date (YYYY-MM-DD):', deviceDateStr());

      else if(v){ uiAlert('Please use YYYY-MM-DD format.'); }
    };
  }
}

/* ---------- Firebase login (email + password) ---------- */
function friendlyAuthError(e){
  const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'Wrong email or password. Try again.';
  if(c.includes('email-already-in-use')) return 'An account with this email already exists — press Sign in instead.';
  if(c.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(c.includes('invalid-email')) return 'Please type a valid email address.';
  if(c.includes('too-many-requests')) return 'Too many attempts — wait a minute and try again.';
  if(c.includes('network')) return 'Network problem — check your internet and try again.';
  if(c.includes('configuration-not-found')||c.includes('operation-not-allowed')) return 'Email sign-in is not enabled yet — in the Firebase console open Authentication and enable Email/Password.';
  return (e&&e.message)||'Something went wrong — try again.';
}
function showLogin(msg){
  let ov=document.getElementById('loginOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='loginOverlay';
    ov.style.cssText='position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2));z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px';
    ov.innerHTML=`<div style="background:var(--card);color:var(--text);border-radius:12px;padding:24px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)">
      <div style="font-size:18px;font-weight:bold;color:var(--navy);margin-bottom:2px">AWURABA FROZEN FOODS</div>
      <div style="font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:14px">MANAGEMENT SYSTEM — SIGN IN</div>
      <label>Email</label><input id="liEmail" type="email" style="margin-bottom:10px" autocomplete="username">
      <label>Password</label><input id="liPass" type="password" style="margin-bottom:6px" autocomplete="current-password">
      <div id="liErr" style="color:var(--warn);font-size:12px;min-height:16px;margin-bottom:6px"></div>
      <button class="gold" id="liIn" style="width:100%;margin-top:0">Sign in</button>
      <button id="liUp" style="width:100%;background:var(--muted)">Create account</button>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5">First time? <b>Create account</b> with your email and a password of at least 6 characters. Owners: seviaafrica@gmail.com or seamihub@gmail.com. Forgot your password? Ask your agent to reset it.</div>
    </div>`;
    document.body.appendChild(ov);
    const go=async create=>{
      const email=ov.querySelector('#liEmail').value.trim();
      const pass=ov.querySelector('#liPass').value;
      const err=ov.querySelector('#liErr'); err.textContent='';
      try{
        if(create) await auth.createUserWithEmailAndPassword(email,pass);
        else await auth.signInWithEmailAndPassword(email,pass);
      }catch(e){ err.textContent=friendlyAuthError(e); }
    };
    ov.querySelector('#liIn').onclick=()=>go(false);
    ov.querySelector('#liUp').onclick=()=>go(true);
    ov.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') go(false); }));
  }
  if(msg) ov.querySelector('#liErr').textContent=msg;

async function syncQueue(){
  if(syncing || !isOnline || !db) return;
  if(!salesQueue.length && !purchasesQueue.length && !expensesQueue.length) return;
  syncing = true; updateConnBadge();
  // sales: needs sequential invoice numbers
  if(salesQueue.length){
    let maxNum = 0;
    sales.forEach(s=>{ const m=/^SAL-(\d+)$/.exec(s.invoiceNo||''); if(m) maxNum=Math.max(maxNum,parseInt(m[1],10)); });
    const stillQueued = [];
    for(const item of salesQueue){
      maxNum++;
      try{
        await db.collection('sales').doc().set({
          date:item.date, invoiceNo:'SAL-'+String(maxNum).padStart(4,'0'), productId:item.productId,
          soldAs:item.soldAs, qty:item.qty, payment:item.payment, ts:item.queuedAt||Date.now(), enteredBy:myUserId
        });
      }catch(e){ maxNum--; stillQueued.push(item); }
    }
    salesQueue = stillQueued; saveQueue();
  }
  // purchases: no counter needed, just push each
  if(purchasesQueue.length){
    const stillQueued = [];
    for(const item of purchasesQueue){
      try{
        await db.collection('purchases').doc().set({
          date:item.date, supplier:item.supplier, productId:item.productId, qty:item.qty,
          costPerUnit:item.costPerUnit, payment:item.payment, ts:item.queuedAt||Date.now(), enteredBy:myUserId
        });
      }catch(e){ stillQueued.push(item); }
    }
    purchasesQueue = stillQueued; savePurQueue();
  }
  // expenses
  if(expensesQueue.length){
    const stillQueued = [];
    for(const item of expensesQueue){
      try{
        await db.collection('expenses').doc().set({
          date:item.date, type:item.type, desc:item.desc, amount:item.amount,
          payment:item.payment, ts:item.queuedAt||Date.now(), enteredBy:myUserId
        });
      }catch(e){ stillQueued.push(item); }
    }
    expensesQueue = stillQueued; saveExpQueue();
  }
  syncing = false; updateConnBadge(); render();
}

function priceFor(p, soldAs, which){ // which: 'sell'|'cost'
  const unit = which==='sell'? p.sellUnit : p.costUnit;
  if(soldAs==='Piece'){ const n=Number(p.subPerUnit); if(!(n>0)) return null; if(which==='sell' && p.sellSub!=null && p.sellSub!=='') return Number(p.sellSub); return unit/n; }
  if(soldAs==='Kg') return p.boxWeight? unit/p.boxWeight : null;
  if(soldAs==='Half Kg') return p.boxWeight? unit/p.boxWeight/2 : null;
  if(soldAs==='Half Box') return unit/2;
  return unit; // 'Box' = box/pack/sachet/strip, sold whole
}
function boxEquiv(sale, p){
  if(!p) return 0;
  if(sale.soldAs==='Kg') return p.boxWeight? sale.qty/p.boxWeight : 0;
  if(sale.soldAs==='Half Kg') return p.boxWeight? (sale.qty*0.5)/p.boxWeight : 0;
  if(sale.soldAs==='Piece') return Number(p.subPerUnit)>0 ? sale.qty/Number(p.subPerUnit) : 0;
  if(sale.soldAs==='Half Box') return sale.qty*0.5;
  return sale.qty; // 'Box'
}

  return 'SAL-' + String(max+1).padStart(4,'0');

function findP(id){ return products.find(p=>p.id===id) || offlineProducts.find(p=>p.id===id); }

function balanceFor(id){
  const p = findP(id); if(!p) return 0;
  const bought = purchases.filter(x=>x.productId===id).reduce((s,x)=>s+Number(x.qty||0),0)
               + purchasesQueue.filter(x=>x.productId===id).reduce((s,x)=>s+Number(x.qty||0),0)
               + Number(p.archivedBought||0);
  const sold = sales.filter(x=>x.productId===id).reduce((s,x)=>s+boxEquiv(x,p),0)
             + salesQueue.filter(x=>x.productId===id).reduce((s,x)=>s+boxEquiv(x,p),0)
             + Number(p.archivedSold||0);
  return (Number(p.openingStock)||0) + Number(p.stockAdjust||0) + bought - sold;
}

async function ensureSeed(){
  const freshCheck = await db.collection('products').doc('KG-0001').get();
  if(!freshCheck.exists){
    // migrate any old-format product docs (KG001 etc.) to the new KG-0001 style, preserving edits
    for(const [oldId,newId] of Object.entries(ID_MIGRATION)){
      const oldDoc = await db.collection('products').doc(oldId).get();
      if(oldDoc.exists){
        const data = oldDoc.data();
        const seedMatch = SEED_PRODUCTS.find(p=>p.id===newId) || {};
        await db.collection('products').doc(newId).set({
          ...data, id:newId,
          name: newId==='PKG-0002' ? 'Chicken Sausage Pack' : data.name,
          category: seedMatch.category || data.category,
          displayOrder: seedMatch.displayOrder || 0,
        });
        await db.collection('products').doc(oldId).delete();
        // repoint any sales/purchases that referenced the old id
        const oldSales = await db.collection('sales').where('productId','==',oldId).get();
        for(const d of oldSales.docs){ await db.collection('sales').doc(d.id).update({productId:newId}); }
        const oldPur = await db.collection('purchases').where('productId','==',oldId).get();
        for(const d of oldPur.docs){ await db.collection('purchases').doc(d.id).update({productId:newId}); }
      }
    }
    // add any brand-new products (Hake, Beef Sausage) that never existed under an old id
    for(const p of SEED_PRODUCTS){
      const exists = await db.collection('products').doc(p.id).get();
      if(!exists.exists){ await db.collection('products').doc(p.id).set(p); }
    }

  const ssnap = await db.collection('suppliers').limit(1).get();
  if(ssnap.empty){

async function archiveOldRecords(){
  const status = document.getElementById('archiveStatus');
  const cutoff = document.getElementById('archiveCutoff').value;
  if(!cutoff){ status.textContent = 'Pick a cutoff date first.'; return; }
  if(!(await uiConfirm(`Archive every Sale, Purchase and Expense dated before ${cutoff}? A backup downloads first automatically. This cannot be undone.`))) return;
  status.textContent = 'Backing up…';
  try{ await loadXLSX(); }catch(e){ status.textContent = 'Export library failed to load — check your connection and retry.'; return; }
  try{
    const oldSales = (await db.collection('sales').where('date','<',cutoff).limit(1000).get()).docs.map(d=>({_id:d.id,...d.data()}));
    const oldPur = (await db.collection('purchases').where('date','<',cutoff).limit(1000).get()).docs.map(d=>({_id:d.id,...d.data()}));
    const oldExp = (await db.collection('expenses').where('date','<',cutoff).limit(1000).get()).docs.map(d=>({_id:d.id,...d.data()}));
    if(!oldSales.length && !oldPur.length && !oldExp.length){ status.textContent = 'Nothing to archive before that date.'; return; }
    // backup exactly what's being archived
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(oldSales), 'Archived Sales');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(oldPur), 'Archived Purchases');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(oldExp), 'Archived Expenses');
    XLSX.writeFile(wb, `Awuraba_Archive_Before_${cutoff}.xlsx`);
    status.textContent = 'Folding totals into stock figures…';
    // fold quantities into each affected product's permanent running totals
    const boughtDelta = {}, soldDelta = {};
    oldPur.forEach(x=>{ boughtDelta[x.productId] = (boughtDelta[x.productId]||0) + Number(x.qty||0); });
    oldSales.forEach(x=>{ const p=findP(x.productId); if(!p) return; soldDelta[x.productId] = (soldDelta[x.productId]||0) + boxEquiv(x,p); });
    const affected = new Set([...Object.keys(boughtDelta), ...Object.keys(soldDelta)]);
    for(const pid of affected){
      const p = findP(pid); if(!p) continue;
      await db.collection('products').doc(pid).update({
        archivedBought: Number(p.archivedBought||0) + (boughtDelta[pid]||0),
        archivedSold: Number(p.archivedSold||0) + (soldDelta[pid]||0),
      });
    }
    status.textContent = 'Deleting archived detail records…';
    for(const x of oldSales){ await db.collection('sales').doc(x._id).delete(); }
    for(const x of oldPur){ await db.collection('purchases').doc(x._id).delete(); }
    for(const x of oldExp){ await db.collection('expenses').doc(x._id).delete(); }
    status.textContent = `Done — archived ${oldSales.length+oldPur.length+oldExp.length} record(s). Backup downloaded.`;
  }catch(e){
    console.error(e);
    status.textContent = "Something went wrong partway through — check your connection. It's safe to try again; already-archived items won't be double-counted since they'll no longer match the date filter.";
  }
}

function backupBase(){ try{ const lb=Number(localStorage.getItem('awuraba_last_backup')||0); let fs=Number(localStorage.getItem('awuraba_first_seen')||0); if(!fs){ fs=Date.now(); localStorage.setItem('awuraba_first_seen',String(fs)); } return {lb,base:Math.max(lb,fs)}; }catch(e){ return {lb:0,base:Date.now()}; } }
function lastBackupText(){ const {lb}=backupBase(); return lb? new Date(lb).toLocaleDateString() : 'never'; }
function backupBanner(){ if(!isOwner) return ''; const {base}=backupBase(); if(Date.now()-base < 30*86400000) return ''; return `<div class="banner" id="backupBanner">\ud83d\uddc2 Monthly reminder: it's been over 30 days since your last backup. <button id="bannerBackup" class="gold" style="margin:0 0 0 8px;padding:5px 10px;font-size:12px">Download backup now</button></div>`; }
function loadXLSX(){
  return new Promise((resolve,reject)=>{
    if(window.XLSX) return resolve();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}

function renderReport(){
  const t = reportDate;
  const daySales = [...sales.filter(s=>s.date===t), ...salesQueue.filter(s=>s.date===t)];
  const dayExp = [...expenses.filter(e=>e.date===t), ...expensesQueue.filter(e=>e.date===t)].reduce((s,e)=>s+Number(e.amount||0),0);
  let totalSales=0, grossProfit=0;
  const byProd={}, byPay={Cash:0,Momo:0,'Bank Transfer':0};
  daySales.forEach(x=>{
    const p=findP(x.productId); if(!p) return;
    const sp=priceFor(p,x.soldAs,'sell'), cp=priceFor(p,x.soldAs,'cost');
    const amt = sp? sp*x.qty : 0, profit = (sp&&cp)? (sp-cp)*x.qty : 0;
    totalSales+=amt; grossProfit+=profit;
    byProd[p.name]=(byProd[p.name]||0)+amt;
    byPay[x.payment]=(byPay[x.payment]||0)+amt;
  });
  const cogs = totalSales - grossProfit, netProfit = grossProfit - dayExp;
  const top = Object.entries(byProd).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const txCount = p => daySales.filter(x=>x.payment===p).length;
  document.getElementById('view-report').innerHTML = `
    <div class="card"><h2>Daily Report</h2>
    ${(salesQueue.filter(s=>s.date===t).length||expensesQueue.filter(e=>e.date===t).length)? `<p style="font-size:11.5px;color:var(--muted);margin:-6px 0 10px">Includes items still waiting to sync from this device.</p>`:''}

    <div class="grid">
      <div>
        <div class="readout">Total Sales: <b>${GHS(totalSales)}</b></div>
        <div class="readout">Cost of Goods Sold: <b>${GHS(cogs)}</b></div>
        <div class="readout" style="border-color:var(--ok)">Gross Profit: <b>${GHS(grossProfit)}</b></div>
        <div class="readout">Expenses for the Day: <b>${GHS(dayExp)}</b></div>
        <div class="readout" style="border-color:var(--ok)">Net Profit: <b>${GHS(netProfit)}</b></div>
      </div>
      <div>
        <div class="readout">Cash Sales: <b>${GHS(byPay.Cash)}</b> (${txCount('Cash')} tx)</div>
        <div class="readout">MoMo Sales: <b>${GHS(byPay.Momo)}</b> (${txCount('Momo')} tx)</div>
        <div class="readout">Bank Transfer Sales: <b>${GHS(byPay['Bank Transfer'])}</b> (${txCount('Bank Transfer')} tx)</div>
        <div class="readout">Total Transactions: <b>${daySales.length}</b></div>
      </div>
    </div>
    </div>
    <div class="card"><h2>Top Selling Products (${t})</h2>
    ${top.length? `<div class="twrap"><table><tr><th>Rank</th><th>Product</th><th>Sales</th></tr>
      ${top.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${GHS(r[1])}</td></tr>`).join('')}</table></div>`
      : '<div class="empty">No sales logged for this date.</div>'}
    </div>`;
  document.getElementById('reportDateInput').onchange = e => { reportDate = e.target.value; render(); };
}

async function applyStocktake(){
  const st=document.getElementById('stStatus');
  if(!isOwner) return;
  if(!isOnline){ uiAlert('A stocktake needs a connection. Try again when you are online.'); return; }
  const rows=Object.entries(stCounts).filter(([id,v])=>v!==''&&v!=null);
  if(!rows.length){ uiAlert('Type at least one counted quantity first.'); return; }
  for(const [id,v] of rows){ const n=Number(v); if(!isFinite(n)||n<0){ uiAlert('Counts must be zero or more.'); return; } }
  const first=stFirstChecked;
  if(!(await uiConfirm(`${first?'Set opening stock from':'Apply'} ${rows.length} count(s)? This changes stock figures and is logged.`))) return;
  const rd=x=>Math.round(x*10000)/10000;
  try{
    for(const [id,v] of rows){
      const p=findP(id); if(!p) continue;
      const counted=Number(v), prev=balanceFor(id), net=netMovementFor(id);
      const upd=first?{openingStock:rd(counted-net),stockAdjust:0}:{stockAdjust:rd(Number(p.stockAdjust||0)+(counted-prev))};
      await db.collection('products').doc(id).update(upd);
      await db.collection('stocktakes').doc().set({productId:id,productName:p.name,mode:first?'setup':'adjust',previous:rd(prev),counted:rd(counted),difference:rd(counted-prev),date:todayStr(),ts:Date.now(),enteredBy:myUserId});
    }
    stCounts={}; stFirstChecked=false; render();
  }catch(e){ console.error(e); if(st) st.textContent="Something went wrong partway — check the history below, then retry the rows not yet applied."; }
}

function canDel(r){ return canWrite && (isOwner || !!r.localId); }
function editBtn(col,r){ return (canWrite && !r.localId && r._id) ? `<button class="edit-row" data-col="${col}" data-id="${r._id}" style="margin:0 4px 0 0;padding:4px 8px;font-size:11px">Edit</button>` : ''; }
function editMark(r){ return r.editedAt ? ' <span style="color:var(--muted);font-size:10px">\u270e edited</span>' : ''; }
function startEdit(col,id){ editState={col,id,scroll:true}; render(); }
async function maybeUpdate(col,payload){
  if(!editState||editState.col!==col) return false;
  try{ await db.collection(col).doc(editState.id).update({...payload,editedBy:myUserId,editedAt:Date.now()}); editState=null; render(); }
  catch(e){ uiAlert("Couldn't save the change — check your connection and try again."); }
  return true;
}
function applyEdit(){
  if(!editState || editState.col!==tab) return;
  const list={sales,purchases,expenses}[tab]; const r=(list||[]).find(x=>x._id===editState.id);
  if(!r){ editState=null; return; }
  const cfg={sales:['saleForm','saveSale',['date','productId','soldAs','qty','payment']],purchases:['purForm','savePur',['date','supplier','productId','qty','costPerUnit','payment']],expenses:['expForm','saveExp',['date','type','desc','amount','payment']]}[tab];
  const form=document.getElementById(cfg[0]), btn=document.getElementById(cfg[1]);
  if(!form||!btn||!form.elements) return;
  cfg[2].forEach(f=>{ if(form.elements[f]) form.elements[f].value = r[f]!=null? r[f] : ''; if(tab==='sales'&&f==='productId') fillSoldModes(form); });
  if(tab==='sales' && form.elements.invoiceNo) form.elements.invoiceNo.value=r.invoiceNo||'';
  btn.textContent='Update entry';
  btn.insertAdjacentHTML('afterend','<button id="cancelEdit" style="background:var(--muted);margin-left:8px">Cancel edit</button>');
  form.insertAdjacentHTML('beforebegin','<div class="banner">Editing an existing entry — change what you need, then press <b>Update entry</b>.</div>');
  document.getElementById('cancelEdit').onclick=()=>{ editState=null; render(); };
  setTimeout(()=>form.dispatchEvent(new Event('input')),0);
  if(editState.scroll){ editState.scroll=false; form.scrollIntoView({block:'center'}); }
}
async function checkSale(pl){
  const p=findP(pl.productId);
  if(!p){ uiAlert('Product not found.'); return false; }
  if(!positiveNum(pl.qty)){ uiAlert('Quantity must be greater than zero.'); return false; }
  if(!dateOk(pl.date)){ uiAlert('Date cannot be more than 1 day in the future.'); return false; }
  if(priceFor(p,pl.soldAs,'sell')==null){ uiAlert(`${p.name} can't be sold that way — pick one of the options offered for it.`); return false; }
  if(pl.soldAs!=='Kg' && !Number.isInteger(pl.qty)){ uiAlert('For Half Kg, Box and Half Box enter a whole number (e.g. 2, not 2.5). Use Kg for fractions.'); return false; }
  const lim={'Kg':50,'Half Kg':100,'Box':20,'Half Box':40,'Piece':200}[pl.soldAs]||20;
  if(pl.qty>lim && !(await uiConfirm(`That's a big sale: ${pl.qty} ${pl.soldAs} of ${p.name}. Is that right?`))) return false;
  let avail=balanceFor(p.id);
  if(editState&&editState.col==='sales'){ const o=sales.find(x=>x._id===editState.id); if(o&&o.productId===p.id) avail+=boxEquiv(o,p); }
  const need=boxEquiv(pl,p);
  if(need>avail+1e-9 && !(await uiConfirm(`The app shows only ${avail.toFixed(1)} of ${p.name} in stock, but this sale needs ${need.toFixed(1)}. Record it anyway?`))) return false;
  return true;
}
async function checkPurchase(pl){
  const p=findP(pl.productId);
  if(!p){ uiAlert('Product not found.'); return false; }
  if(!positiveNum(pl.qty)){ uiAlert('Quantity must be greater than zero.'); return false; }
  if(!positiveNum(pl.costPerUnit)){ uiAlert('Cost per unit must be greater than zero.'); return false; }
  if(!dateOk(pl.date)){ uiAlert('Date cannot be more than 1 day in the future.'); return false; }
  if(!Number.isInteger(pl.qty)){ uiAlert('Enter whole boxes/packs/sachets (e.g. 5, not 5.5).'); return false; }
  if(pl.qty>Math.max(50,10*Number(p.minStock||0)) && !(await uiConfirm(`That's a large purchase: ${pl.qty} of ${p.name}. Is that right?`))) return false;
  const c=Number(p.costUnit||0);
  if(c>0 && (pl.costPerUnit>c*1.5 || pl.costPerUnit<c*0.5) && !(await uiConfirm(`Cost per unit ${GHS(pl.costPerUnit)} is very different from the price list (${GHS(c)}). Record it anyway?`))) return false;
  return true;
}
async function checkExpense(pl){
  if(!positiveNum(pl.amount)){ uiAlert('Amount must be greater than zero.'); return false; }
  if(!dateOk(pl.date)){ uiAlert('Date cannot be more than 1 day in the future.'); return false; }
  if(pl.amount>100000){ uiAlert('That amount looks too large — please check it.'); return false; }
  if(pl.amount>1000 && !(await uiConfirm(`${GHS(pl.amount)} is a large expense. Is that right?`))) return false;
  return true;
}
async function deleteRow(col, id, localId){
  if(!localId && !isOwner){ uiAlert('Only the owner can delete saved records.'); return; }
  if(!(await uiConfirm('Delete this record? This cannot be undone.'))) return;
  if(localId){
    if(col==='sales'){ salesQueue = salesQueue.filter(x=>x.localId!==localId); saveQueue(); }
    if(col==='purchases'){ purchasesQueue = purchasesQueue.filter(x=>x.localId!==localId); savePurQueue(); }
    if(col==='expenses'){ expensesQueue = expensesQueue.filter(x=>x.localId!==localId); saveExpQueue(); }
    updateConnBadge(); render(); return;
  }
  try{ await db.collection(col).doc(id).delete(); }
  catch(e){ uiAlert('Could not delete — check your connection and try again.'); }
}
function wireDeleteButtons(){
  document.querySelectorAll('.edit-row').forEach(b=>{ b.onclick=()=>startEdit(b.dataset.col,b.dataset.id); });
  applyEdit();
  document.querySelectorAll('.del-row').forEach(b=>{
    b.onclick = () => deleteRow(b.dataset.col, b.dataset.id||null, b.dataset.local||null);
  });
}

  const delBtn = editBtn('sales',x) + (canDel(x) ? `<button class="del-row" data-col="sales" data-id="${x._id||''}" data-local="${x.localId||''}" style="margin:0;padding:4px 8px;font-size:11px;background:var(--warn)">Delete</button>` : '');
  return `<tr${rowStyle}><td>${x.date||''}</td><td>${pending?'\u23f3 pending sync':(x.invoiceNo||'')}</td><td>${p.name}</td><td>${soldLabel(p,x.soldAs)}</td><td>${x.qty}</td>
    <td>${sp?GHS(sp):'—'}</td><td>${GHS(salesAmt)}</td><td>${GHS(profitAmt)}</td><td>${x.payment}</td><td>${pending?'You (offline)':nameForId(x.enteredBy)}${editMark(x)}</td><td>${delBtn}</td></tr>`;

function renderInventory(){
  const rows = [...products].sort((a,b)=>(a.displayOrder||99)-(b.displayOrder||99)).map(p=>{
    const boughtSynced = purchases.filter(x=>x.productId===p.id).reduce((s,x)=>s+Number(x.qty||0),0) + Number(p.archivedBought||0);
    const boughtPending = purchasesQueue.filter(x=>x.productId===p.id).reduce((s,x)=>s+Number(x.qty||0),0);
    const soldSynced = sales.filter(x=>x.productId===p.id).reduce((s,x)=>s+boxEquiv(x,p),0) + Number(p.archivedSold||0);
    const soldPending = salesQueue.filter(x=>x.productId===p.id).reduce((s,x)=>s+boxEquiv(x,p),0);
    const bought = boughtSynced+boughtPending, sold = soldSynced+soldPending;
    const bal = (Number(p.openingStock)||0)+Number(p.stockAdjust||0)+bought-sold;
    const low = bal <= Number(p.minStock||0);
    const pendingNote = (boughtPending||soldPending) ? ` <span style="color:var(--muted);font-size:10px">(incl. pending)</span>` : '';
    return `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.openingStock}</td><td>${Number(p.stockAdjust||0).toFixed(1)}</td><td>${bought.toFixed(1)}${pendingNote}</td><td>${sold.toFixed(1)}${pendingNote}</td>
      <td><b>${bal.toFixed(1)}</b>${Number(p.subPerUnit)>0?` <span style="color:var(--muted);font-size:10px">(${Math.round(bal*Number(p.subPerUnit))} ${(p.subLabel||'Sachet').toLowerCase()}s)</span>`:''}</td><td><span class="badge ${low?'low':'ok'}">${low?'\u26a0 LOW STOCK':'\u2713 OK'}</span></td></tr>`;
  }).join('');
  document.getElementById('view-inventory').innerHTML = `
    <div class="card"><h2>Inventory (Stock Balance)</h2>
    <div class="twrap"><table><tr><th>ID</th><th>Product</th><th>Opening</th><th>Adjust</th><th>Bought</th><th>Sold</th><th>Balance</th><th>Status</th></tr>
    ${rows}</table></div></div>`;
}

    <form id="expForm" class="grid">
      <div><label>Date</label><input type="date" name="date" value="${todayStr()}" max="${maxAllowedDate()}" required></div>
      <div><label>Expense Type</label><select name="type">${EXP_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div><label>Description</label><input name="desc" placeholder="Optional"></div>
      <div><label>Amount</label><input type="number" step="0.01" name="amount" min="0.01" required></div>
      <div><label>Payment Method</label><select name="payment">${PAYMENTS.map(p=>`<option>${p}</option>`).join('')}</select></div>
    </form>
    <button class="gold" id="saveExp" ${canWrite?'':'disabled'}>${canWrite?(isOnline?'Save Expense':'Save Offline (will sync later)'):'Read-only'}</button>
    </div>
    <div class="card"><h2>All Expenses — Total ${GHS(total)}</h2>
    <div class="twrap"><table><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th><th>Payment</th><th>Entered By</th><th></th></tr>
    ${rows||'<tr><td colspan=7 class="empty">No expenses logged yet.</td></tr>'}</table></div></div>`;
  wireDeleteButtons();
  document.getElementById('saveExp').onclick = async () => {
    if(!canWrite) return;
    const form = document.getElementById('expForm'); const fd = new FormData(form);
    const payload = { date: fd.get('date'), type: fd.get('type'), desc: fd.get('desc')||'',
      amount: Number(fd.get('amount'))||0, payment: fd.get('payment') };
    if(!(await checkExpense(payload))) return;
    if(await maybeUpdate('expenses',payload)) return;
    if(!positiveNum(payload.amount)){ uiAlert('Amount must be greater than zero.'); return; }
    if(!dateOk(payload.date)){ uiAlert('Date cannot be more than 1 day in the future.'); return; }
    if(isOnline){
      try{
        await db.collection('expenses').doc().set({...payload, ts: Date.now(), enteredBy: myUserId});
      }catch(e){
        expensesQueue.push({...payload, localId:makeLocalId(), queuedAt:Date.now()});
        saveExpQueue(); updateConnBadge();
      }
    } else {
      expensesQueue.push({...payload, localId:makeLocalId(), queuedAt:Date.now()});
      saveExpQueue(); updateConnBadge();
    }
    form.reset(); form.date.value = todayStr();
    render();
  };
}

async function init(){
  render(); // paint immediately with empty state
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  auth = firebase.auth();
  auth.onAuthStateChanged(u=>{
    const so=document.getElementById('soBtn'); if(so) so.remove();
    if(u){
      hideLogin();
      myUserId = u.email || u.uid;
      canWrite = true;
      isOwner = OWNERS.includes((u.email||'').toLowerCase());
      const soBtn=document.createElement('button');
      soBtn.id='soBtn'; soBtn.textContent='Sign out ('+u.email+')';
      soBtn.style.cssText='background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);margin:0;padding:5px 10px;font-size:11px;font-weight:normal';
      soBtn.onclick=signOutUser;
      document.querySelector('.brand').appendChild(soBtn);
      if(!subscribed){
        subscribed=true;
        ensureSeed().catch(e=>console.error(e));
        applyPackDefaults().catch(e=>console.error(e));
        priceSyncV3().catch(e=>console.error(e));
        subscribe();
        syncQueue();
        setInterval(()=>{ if(isOnline) syncQueue(); }, 30000);
      }
      render();
    } else {
      canWrite=false; isOwner=false; myUserId=null;
      showLogin();
      render();
    }
  });
}
init();
</script>
</body>
</html>
